build-prod:
  image: docker:stable
  stage: deploy
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build 
      --build-arg VITE_API_BASE_URL="http://localhost:3000/" 
      --build-arg VITE_UNSPLASH_API_KEY="3aIrVY7XpHqMaMoEoRJpuDdSMoqRsMyB4s8IA4mcE8I" 
      --build-arg VITE_MAPBOX_API_KEY="pk.eyJ1IjoibWlja2FlbGRlc2NsYXV4IiwiYSI6ImNtMHBkcXlpbDAwMmsycXF5dTl6Mzk4NTQifQ.gqc-v56D-UbJ4jAcP3qAJQ" 
      --build-arg VITE_MAPBOX_SESSION_TOKEN="[GENERATED-UUID]"
      -t $CI_REGISTRY:$TAG_PROD .
    - docker push $CI_REGISTRY:$TAG_PROD

  rules:
    - when : manual